<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Suscripción Nélida PRO - Pago Seguro</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #00ffcc;
            --neon-purple: #8e44ad;
            --glass-bg: rgba(0, 0, 0, 0.85);
            --glass-border: rgba(0, 255, 204, 0.3);
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: #050505;
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #000000 100%);
            font-family: 'Segoe UI', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .checkout-container {
            display: flex;
            flex-direction: column; /* Apilado en móvil */
            width: 100%;
            max-width: 500px; /* Ancho máximo total para móvil */
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .checkout-container { flex-direction: row; max-width: 900px; }
        }

        /* PANELES */
        .summary-panel, .payment-panel {
            flex: 1;
            padding: 30px;
        }

        .summary-panel {
            background: linear-gradient(135deg, rgba(142,68,173,0.2) 0%, rgba(0,0,0,0) 100%);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        @media (min-width: 768px) {
            .summary-panel { border-bottom: none; border-right: 1px solid rgba(255,255,255,0.1); }
        }

        h1, h2 { font-family: 'Orbitron', sans-serif; }
        h1 { color: var(--neon-green); font-size: 1.5em; letter-spacing: 1px; }

        .price-tag { font-size: 1.8em; font-weight: bold; margin: 15px 0; }
        .price-tag span { font-size: 0.5em; color: var(--text-muted); display: block; }

        .benefits-list { list-style: none; padding: 0; margin: 20px 0; font-size: 0.95em; }
        .benefits-list li { margin-bottom: 10px; display: flex; align-items: center; }
        .benefits-list li::before { content: '✓'; color: var(--neon-green); margin-right: 10px; }

        .payment-methods { display: flex; gap: 10px; margin-bottom: 20px; }
        .method-btn { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 0.8em; }
        .method-btn.active { border-color: var(--neon-purple); background: rgba(142, 68, 173, 0.2); }

        .pay-box { display: none; }
        .pay-box.active-box { display: block; }

        .pay-btn { display: block; width: 100%; text-align: center; color: #fff; background: #009EE3; padding: 15px; border-radius: 8px; font-weight: bold; text-decoration: none; margin-top: 15px; }
        
        .secure-badge { text-align: center; margin-top: 20px; font-size: 0.75em; color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="checkout-container">
        <div class="summary-panel">
            <h1>NÉLIDA PRO</h1>
            <div class="price-tag">
                $13.999 ARS <span>/ mes (o $9.99 USD Exterior)</span>
            </div>
            <ul class="benefits-list">
                <li>Mensajes ilimitados</li>
                <li>Reportes PDF y Excel</li>
                <li>Presentaciones PPT</li>
                <li>Soporte prioritario</li>
            </ul>
        </div>

        <div class="payment-panel">
            <h2>Pago</h2>
            <div class="payment-methods">
                <button type="button" class="method-btn active" onclick="mostrarMetodo('mp', this)">MP</button>
                <button type="button" class="method-btn" onclick="mostrarMetodo('paypal', this)">PayPal</button>
                <button type="button" class="method-btn" onclick="window.location.href='menu.html'">Gratis</button>
            </div>

            <div id="mp-box" class="pay-box active-box">
                <a href="https://www.mercadopago.com.ar/subscriptions/checkout?preapproval_plan_id=498087b7b10645b79fb5b314ac870bd8" class="pay-btn">Suscribirse con MP</a>
            </div>

            <div id="paypal-box" class="pay-box">
                <div id="paypal-button-container-P-1KW822034C763352DNIGHICQ"></div>
            </div>

            <div class="secure-badge">🔒 Pagos seguros y cifrados.</div>
        </div>
    </div>

    <script>
        function mostrarMetodo(metodo, boton) {
            document.querySelectorAll('.method-btn').forEach(b => b.classList.remove('active'));
            boton.classList.add('active');
            document.querySelectorAll('.pay-box').forEach(c => c.classList.remove('active-box'));
            document.getElementById(metodo + '-box').classList.add('active-box');
        }
    </script>
    <script src="https://www.paypal.com/sdk/js?client-id=BAAN4ARxixrtl7daE3GLRBgtiK7hMYdixmNIY4KHn3gJedt9O69N4MpRFuVL9HTXI0e0I4q9Q5qpYd0mRI&vault=true&intent=subscription"></script>
    <script>
        paypal.Buttons({
            createSubscription: (data, actions) => actions.subscription.create({ plan_id: 'P-1KW822034C763352DNIGHICQ' }),
            onApprove: () => window.location.href = 'menu.html?validar=NelidaAI_Pro_Suscripcion_Segura_2026_X'
        }).render('#paypal-button-container-P-1KW822034C763352DNIGHICQ');
    </script>
</body>
</html>
