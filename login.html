<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nélida AI - Iniciar Sesión</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, FacebookAuthProvider, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBVEFGwRHGjX1TuyXQohdTXsm4Tq39jSkg",
            authDomain: "nelida-e89d3.firebaseapp.com",
            projectId: "nelida-e89d3",
            storageBucket: "nelida-e89d3.firebasestorage.app",
            messagingSenderId: "135147571928",
            appId: "1:135147571928:web:347838ce007dac458225ad"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        const googleProvider = new GoogleAuthProvider();
        const facebookProvider = new FacebookAuthProvider();

        const contarVisita = async () => {
            try {
                await setDoc(doc(db, "analitica", "visitas"), {
                    total: increment(1)
                }, { merge: true });
            } catch (error) {
                console.error("Error al registrar visita:", error);
            }
        };

        contarVisita();

        const actualizarUltimoLogin = async (user) => {
            try {
                await setDoc(doc(db, "usuarios", user.uid), {
                    email: user.email || "Usuario sin email",
                    fecha_registro: serverTimestamp(),
                    ultimo_acceso: serverTimestamp()
                }, { merge: true });
            } catch (error) { console.error("Error al actualizar login:", error); }
        };

        window.loginConGoogle = async () => {
            try {
                const result = await signInWithPopup(auth, googleProvider);
                await actualizarUltimoLogin(result.user);
                window.location.href = "checkout.html"; 
            } catch (e) { alert("Error Google: " + e.message); }
        };

        window.loginConFacebook = async () => {
            try {
                const result = await signInWithPopup(auth, facebookProvider);
                await actualizarUltimoLogin(result.user);
                window.location.href = "checkout.html"; 
            } catch (e) { alert("Error Facebook: " + e.message); }
        };

        window.authEmail = async () => {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('pass').value;
            
            if(!email || !pass) return alert("Por favor, completa los campos.");

            try {
                const result = await signInWithEmailAndPassword(auth, email, pass);
                await actualizarUltimoLogin(result.user);
                window.location.href = "checkout.html"; 
            } catch (e) {
                alert("❌ El correo o la contraseña son incorrectos. Si todavía no tenés una cuenta, hacé clic abajo en 'Registrate acá'.");
            }
        };
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, sans-serif; }
        .contenedor { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; }
        .img-fondo { width: 100%; height: 100%; object-fit: cover; position: absolute; z-index: 1; }
        .columna-izquierda { position: relative; left: 65px; width: 300px; z-index: 10; display: flex; flex-direction: column; gap: 12px; background: rgba(0, 0, 0, 0.4); padding: 20px; border-radius: 20px; backdrop-filter: blur(5px); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .btn-social { width: 100%; height: 40px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.3); background: white; color: #333; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-social img { width: 18px; height: 18px; }
        .btn-facebook { background: #1877F2; color: white; border: none; }
        .form-auth { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 20px; }
        input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; background: rgba(255,255,255,0.95); font-size: 13px; color: #000; }
        .btn-entrar { background: #007bff; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 13px; text-transform: uppercase; }
        .btn-ir-registro { background: transparent; color: #00ffcc; border: 1px dashed #00ffcc; padding: 10px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 12px; text-transform: uppercase; text-align: center; text-decoration: none; margin-top: 5px; }
        .btn-ir-registro:hover { background: rgba(0, 255, 204, 0.1); }
        
        .legal-footer {
            margin-top: 10px;
            text-align: center;
            font-size: 10.5px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.4;
        }
        .legal-footer a {
            color: #00ffcc;
            text-decoration: none;
            font-weight: bold;
        }
        .legal-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <img src="versiones_nelida/sexologa.png" class="img-fondo">
        <div class="columna-izquierda">
            <button class="btn-social" onclick="window.loginConGoogle()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                Continuar con Google
            </button>
            <button class="btn-social btn-facebook" onclick="window.loginConFacebook()">
                <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/2021_Facebook_icon.svg" alt="FB">
                Continuar con Facebook
            </button>
            <div class="form-auth">
                <input type="text" id="email" placeholder="Tu correo electrónico">
                <input type="password" id="pass" placeholder="Tu contraseña">
                <button class="btn-entrar" onclick="window.authEmail()">Ingresar</button>
                
                <a href="registro.html" class="btn-ir-registro">¿No tenés cuenta? Registrate acá</a>
            </div>
            
            <div class="legal-footer">
                Al ingresar, aceptas nuestros <br>
                <a href="terminos.html">Términos de Servicio</a> y la <a href="privacidad.html">Política de Privacidad</a>.
            </div>
        </div>
    </div>
</body>
</html>
