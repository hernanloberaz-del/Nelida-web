<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nélida AI - Login</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, FacebookAuthProvider, OAuthProvider, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBVEFGwRHGjX1TuyXQohdTXsm4Tq39jSkg",
            authDomain: "nelida-e89d3.firebaseapp.com",
            projectId: "nelida-e89d3",
            storageBucket: "nelida-e89d3.firebasestorage.app",
            messagingSenderId: "135147571928",
            appId: "1:135147571928:web:347838ce007dac458225ad"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        const googleProvider = new GoogleAuthProvider();
        const facebookProvider = new FacebookAuthProvider();
        const appleProvider = new OAuthProvider('apple.com');

        const guardarUsuario = async (user) => {
            try {
                const paisDetectado = navigator.language || "es-AR";
                await setDoc(doc(db, "usuarios", user.uid), {
                    nombre: user.displayName || "Usuario Nuevo",
                    email: user.email,
                    foto: user.photoURL || "",
                    pais: paisDetectado,
                    edad: 0,
                    version_seleccionada: "Pendiente",
                    ultimoLogin: new Date()
                }, { merge: true });
                console.log("Perfil actualizado.");
            } catch (error) {
                console.error("Error al guardar:", error);
            }
        };

        window.loginConGoogle = async () => {
            try {
                const result = await signInWithPopup(auth, googleProvider);
                await guardarUsuario(result.user);
                window.location.href = "checkout.html"; 
            } catch (e) { alert("Error Google: " + e.message); }
        };

        window.loginConFacebook = async () => {
            try {
                const result = await signInWithPopup(auth, facebookProvider);
                await guardarUsuario(result.user);
                window.location.href = "checkout.html"; 
            } catch (e) {
                console.error(e);
                alert("Error Facebook: " + e.message);
            }
        };

        window.loginConApple = async () => {
            try {
                const result = await signInWithPopup(auth, appleProvider);
                await guardarUsuario(result.user);
                window.location.href = "checkout.html"; 
            } catch (e) { alert("Error Apple: " + e.message); }
        };

        // MOTOR DE AUTENTICACIÓN CON EMAIL TOTALMENTE BLINDADO
        window.authEmail = async () => {
            const emailInput = document.getElementById('email').value.trim();
            const passInput = document.getElementById('pass').value;
            
            // 1. Validar campos vacíos
            if(!emailInput || !passInput) {
                return alert("⚠️ Por favor, completa tanto el correo electrónico como la contraseña.");
            }
            
            // 2. Validar formato de Email real (Evita que pongan un nombre común)
            const expresionRegularEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!expresionRegularEmail.test(emailInput)) {
                return alert("⚠️ Formato de correo inválido. Asegúrate de ingresar una dirección válida con '@' y un dominio (Ej: nombre@correo.com). No ingreses un nombre de usuario normal.");
            }

            // 3. Validar mínimos exigidos por Firebase
            if (passInput.length < 6) {
                return alert("⚠️ Seguridad de contraseña: La contraseña debe tener como mínimo 6 caracteres.");
            }

            try {
                // Primero intentamos iniciar sesión por defecto
                const result = await signInWithEmailAndPassword(auth, emailInput, passInput);
                await guardarUsuario(result.user);
                window.location.href = "checkout.html"; 
            } catch (e) {
                // Si Firebase detecta credenciales inválidas, puede significar que es un usuario nuevo
                if (e.code === 'auth/invalid-credential' || e.code === 'auth/user-not-found') {
                    try {
                        // Intentamos registrarlo automáticamente como cliente nuevo
                        const result = await createUserWithEmailAndPassword(auth, emailInput, passInput);
                        await guardarUsuario(result.user);
                        window.location.href = "checkout.html"; 
                    } catch (regError) {
                        // Si falla porque el mail ya existía, significa que erró la contraseña en el login previo
                        if (regError.code === 'auth/email-already-in-use') {
                            alert("❌ La contraseña ingresada es incorrecta para este correo electrónico registrado.");
                        } else {
                            alert("❌ Error en el registro: " + regError.message);
                        }
                    }
                } else {
                    alert("❌ Error del sistema: " + e.message);
                }
            }
        };
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, sans-serif; }
        .contenedor { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; }
        .img-fondo { width: 100%; height: 100%; object-fit: cover; position: absolute; z-index: 1; }
        .columna-izquierda { position: relative; left: 65px; width: 300px; z-index: 10; display: flex; flex-direction: column; gap: 12px; background: rgba(0, 0, 0, 0.4); padding: 20px; border-radius: 20px; backdrop-filter: blur(5px); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .btn-social { width: 100%; height: 40px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.3); background: white; color: #333; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-social img { width: 18px; height: 18px; }
        .btn-facebook { background: #1877F2; color: white; border: none; }
        .btn-apple { background: #000; color: white; border: none; }
        .form-auth { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 20px; }
        input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; background: rgba(255,255,255,0.95); font-size: 13px; color: #000; }
        .btn-entrar { background: #007bff; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 13px; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="contenedor">
        <img src="versiones_nelida/sexologa.png" class="img-fondo">
        <div class="columna-izquierda">
            <button class="btn-social" onclick="window.loginConGoogle()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                Continuar con Google
            </button>
            <button class="btn-social btn-facebook" onclick="window.loginConFacebook()">
                <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/2021_Facebook_icon.svg" alt="FB">
                Continuar con Facebook
            </button>
            <button class="btn-social btn-apple" onclick="window.loginConApple()">
                <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" style="filter: invert(1);" alt="Apple">
                Continuar con Apple
            </button>
            <div class="form-auth">
                <input type="text" id="email" placeholder="Correo electrónico (ejemplo@mail.com)">
                <input type="password" id="pass" placeholder="Contraseña (mínimo 6 letras/números)">
                <button class="btn-entrar" onclick="window.authEmail()">Entrar / Registrarse</button>
            </div>
        </div>
    </div>
</body>
</html>
