<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nélida AI - Interface Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/PptxGenJS@3.12.0/dist/pptxgen.bundle.js"></script>
    
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --neon-green: #00ffcc;
            --neon-purple: #8e44ad;
            --neon-blue: #00d2ff;
            --glass-bg: rgba(15, 15, 15, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background-color: #030303; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            color: #fff; 
            height: 100vh;
            overflow: hidden; 
        }
        
        /* Imagen de fondo dinámica */
        #fondo-nelida { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            z-index: 1; 
            filter: brightness(0.25) blur(6px); 
            transition: all 0.5s ease-in-out;
        }

        /* Contenedor principal estilo Gemini */
        .app-container {
            position: relative;
            z-index: 10;
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* --- MENU LATERAL (SIDEBAR) --- */
        .sidebar {
            width: 280px;
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 20px;
            height: 100%;
        }

        /* Video reubicado en el menú */
        #caja-video { 
            width: 100%; 
            height: 160px;
            border-radius: 12px;
            overflow: hidden;
            position: relative; 
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid rgba(0, 210, 255, 0.2);
            transition: 0.5s ease-in-out;
            margin-bottom: 20px;
            flex-shrink: 0;
        }
        #caja-video.modo-hablando {
            border-color: var(--neon-blue);
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.35), 0 0 50px rgba(142, 68, 173, 0.2);
        }
        video { width: 100%; height: 100%; object-fit: cover; }

        .sidebar-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85em;
            color: #888;
            letter-spacing: 2px;
            margin-bottom: 10px;
            padding-left: 5px;
        }

        #menu-versiones {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.2) transparent;
        }

        .btn-menu {
            background: transparent;
            color: #e5e5e5;
            border: none;
            padding: 12px 15px;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.95em;
        }
        .btn-menu:hover { background: rgba(255, 255, 255, 0.05); }
        .btn-menu.activo {
            background: rgba(0, 255, 204, 0.1);
            color: var(--neon-green);
            font-weight: bold;
            border-left: 3px solid var(--neon-green);
        }

        .btn-logout {
            margin-top: 15px;
            background: rgba(255, 77, 77, 0.1);
            color: #ff4d4d;
            border: 1px solid rgba(255, 77, 77, 0.3);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-logout:hover { background: rgba(255, 77, 77, 0.2); }

        /* --- ÁREA CENTRAL DE CHAT --- */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            position: relative;
        }

        .status-bar { 
            width: 100%;
            padding: 15px 30px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9em; 
            letter-spacing: 1px; 
            border-bottom: 1px solid rgba(255,255,255,0.05);
            background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 100%);
        }
        #contador-ui { font-weight: bold; transition: 0.3s; }

        #zona-mensajes { 
            flex: 1; 
            width: 100%;
            max-width: 900px;
            overflow-y: auto; 
            padding: 30px 20px; 
            color: #e5e5e5; 
            font-size: 1.05em; 
            line-height: 1.6; 
            scrollbar-width: thin; 
            scrollbar-color: var(--neon-green) transparent; 
        }

        .msg-usuario {
            background: rgba(255, 255, 255, 0.08);
            padding: 15px 22px;
            margin-bottom: 20px;
            border-radius: 20px 20px 0 20px;
            max-width: 80%;
            margin-left: auto;
            text-align: left;
            color: #fff;
            white-space: pre-wrap; 
        }

        .msg-nelida {
            padding: 0 0 30px 0;
            margin-bottom: 10px;
            max-width: 95%;
        }

        /* --- CAJA DE INPUT ESTILO GEMINI --- */
        .input-container {
            width: 100%;
            max-width: 850px;
            padding: 0 20px 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #file-indicator { 
            display: none; 
            align-items: center; 
            gap: 10px; 
            background: rgba(0, 255, 204, 0.1); 
            border: 1px solid var(--neon-green); 
            padding: 8px 15px; 
            border-radius: 15px; 
            font-size: 0.85em; 
            color: var(--neon-green); 
            margin-bottom: 10px;
            align-self: flex-start;
            margin-left: 20px;
        }
        #file-indicator button { background: none; border: none; color: #ff4d4d; cursor: pointer; font-weight: bold; padding: 0 5px; }

        .input-box {
            display: flex;
            align-items: flex-end; 
            width: 100%;
            background: rgba(35, 35, 35, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 25px; 
            padding: 8px 12px;
            transition: 0.3s;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            min-height: 52px;
        }
        .input-box:focus-within {
            background: rgba(45, 45, 45, 0.9);
            border-color: rgba(0, 255, 204, 0.4);
        }

        .btn-clip { 
            background: none; 
            border: none; 
            font-size: 22px; 
            cursor: pointer; 
            padding: 10px; 
            color: #aaa;
            transition: 0.2s;
            border-radius: 50%;
            margin-bottom: 2px; 
        }
        .btn-clip:hover { color: #fff; background: rgba(255,255,255,0.1); }

        /* NUEVO TEXTAREA EXPANDIBLE */
        textarea#userInput { 
            flex: 1; 
            background: transparent; 
            border: none; 
            color: #fff; 
            padding: 12px 15px; 
            outline: none;
            font-size: 16px;
            resize: none; 
            max-height: 120px; 
            overflow-y: auto;
            font-family: inherit;
            line-height: 1.5;
            margin-bottom: 2px;
        }
        textarea#userInput::placeholder { color: #888; }

        .btn-action { 
            background: #fff; 
            color: #000; 
            border: none; 
            padding: 10px 20px; 
            cursor: pointer; 
            border-radius: 20px; 
            font-weight: bold; 
            font-size: 14px;
            transition: 0.2s;
            margin-bottom: 5px; 
        }
        .btn-action:hover { background: var(--neon-green); }

        .escribiendo { color: var(--neon-green); font-style: italic; font-size: 0.9em; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
        .descarga-dinamica { border: none; color: white; padding: 10px 18px; border-radius: 5px; cursor: pointer; font-size: 0.85em; font-family: 'Orbitron', sans-serif; transition: 0.3s; font-weight: bold; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }

        /* --- MOTOR ADAPTATIVO MÓVIL CORREGIDO --- */
       @media (max-width: 768px) {
            .app-container { flex-direction: column; height: 100vh; overflow: hidden; width: 100vw; }
            .sidebar { width: 100%; height: auto; padding: 35px 15px 10px 15px; flex-direction: row; align-items: center; border-right: none; border-bottom: 1px solid var(--glass-border); gap: 10px; flex-shrink: 0; background: rgba(10,10,10,0.9); z-index: 100; }
            #caja-video { width: 50px; height: 50px; border-radius: 50%; margin-bottom: 0; }
            .sidebar-title { display: none; }
            #menu-versiones { flex-direction: row; overflow-x: auto; overflow-y: hidden; padding-bottom: 0; align-items: center; }
            .btn-menu { white-space: nowrap; padding: 6px 10px; font-size: 0.85em; }
            .btn-logout { margin-top: 0; padding: 8px; }
            .btn-logout span { display: none; }
            
            /* --- FORMATO WHATSAPP RECALIBRADO --- */
            .chat-area { height: 100%; justify-content: flex-start; position: relative; width: 100%; }
            
            /* Aseguramos que los mensajes no queden tapados por la caja de texto */
            #zona-mensajes { padding: 15px; padding-bottom: 140px !important; height: 100%; overflow-y: auto; width: 100%; }
            
            /* Respetamos la barra de navegación del celular (Safe Area) */
            .input-container { 
                position: fixed !important; 
                bottom: 0 !important; 
                left: 0 !important; 
                width: 100% !important; 
                padding: 15px 15px calc(20px + env(safe-area-inset-bottom)) 15px !important; 
                background: rgba(10,10,10,0.98) !important; 
                z-index: 9999 !important; 
                border-top: 1px solid #333; 
            }
            .input-box { border-radius: 20px; margin-bottom: 0; min-height: 45px; width: 100%; }
        }
    </style>
</head>
<body>
    <img id="fondo-nelida" src="versiones_nelida/ayuda.png">
    
    <div class="app-container">
        <aside class="sidebar">
            <div id="caja-video">
                <video id="nelida-video" autoplay loop muted playsinline>
                    <source src="versiones_nelida/cerebronelida.mp4" type="video/mp4">
                </video>
            </div>
            
            <div class="sidebar-title">VERSIONES DE NÉLIDA</div>
            <div id="menu-versiones">
                </div>

            <button class="btn-logout" onclick="window.cerrarSesion()">
                🚪 <span>Cerrar Sesión</span>
            </button>
        </aside>

        <main class="chat-area">
            <div class="status-bar">
                <div><span id="label-especialidad" style="color: var(--neon-green);">SISTEMA NÉLIDA</span></div>
                <div id="contador-ui">Cargando sistema...</div>
            </div>
            
            <div id="zona-mensajes">
                <div id="msg-inicial" class="msg-nelida"><b>Nélida:</b> Sincronizando faceta...</div>
            </div>

            <div class="input-container">
                <div id="file-indicator">
                    <span id="file-name">📎 Archivo.pdf</span>
                    <button onclick="window.quitarArchivo()" title="Quitar archivo">✖</button>
                </div>
                
                <div class="input-box">
                    <input type="file" id="archivoAdjunto" style="display: none;" accept=".pdf, .xls, .xlsx, .doc, .docx, .txt, image/*">
                    <button type="button" class="btn-clip" onclick="document.getElementById('archivoAdjunto').click()" title="Adjuntar documento">📎</button>
                    
                    <textarea id="userInput" placeholder="Escribe un mensaje para Nélida..." rows="1"></textarea>
                    
                    <button class="btn-action" onclick="enviar()">Enviar</button>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBVEFGwRHGjX1TuyXQohdTXsm4Tq39jSkg",
            authDomain: "nelida-e89d3.firebaseapp.com",
            projectId: "nelida-e89d3",
            storageBucket: "nelida-e89d3.firebasestorage.app",
            messagingSenderId: "135147571928",
            appId: "1:135147571928:web:347838ce007dac458225ad"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let facetaActiva = "ayuda";
        let historialAcumulado = [];
        let esUsuarioPro = localStorage.getItem('nelida_pro') === 'true';

        const parametrosURL = new URLSearchParams(window.location.search);
        if (parametrosURL.get('pago') === 'ok') {
            esUsuarioPro = true;
            localStorage.setItem('nelida_pro', 'true');
            window.history.replaceState({}, document.title, window.location.pathname);
            setTimeout(() => {
                alert("💎 ¡Pago exitoso! Bienvenido a Nélida PRO. Ahora tenés acceso ilimitado a todas las herramientas.");
            }, 800);
        }

        let mensajesRestantes = esUsuarioPro ? 2000 : 10; 

        const mapaFondos = {
            "abogada": "abogada.PNG",
            "artes_marciales": "ARTES MARCIALES MIXTAS.png",
            "asistente": "nelida_asistente.PNG",
            "ayuda": "ayuda.png",
            "contratista": "contratista.PNG", 
            "Economia": "Economia.PNG",
            "infantes": "infantes.png",
            "maestra": "maestra.png",
            "mecanica": "mecanica.PNG",
            "medica": "medica.png",
            "mejora_continua": "nelida_mc.PNG",
            "trainer": "nelida trainner.png",
            "padel": "padel.png",
            "pesca": "nelida_pesca.PNG",
            "psicologa": "psicologa.png",
            "seguridad_higiene": "nelida_tsh.PNG",
            "sexologa": "sexologa.png",
            "tenis": "tenis.png",
            "terapia_parejas": "terapia deparejas.PNG"
        };

        function renderizarMenu() {
            const menu = document.getElementById('menu-versiones');
            menu.innerHTML = '';
            for (let faceta in mapaFondos) {
                const nombreLimpio = faceta.replace(/_/g, ' ').toUpperCase();
                const claseActiva = (faceta === facetaActiva) ? 'activo' : '';
                menu.innerHTML += `<button id="btn-${faceta}" class="btn-menu ${claseActiva}" onclick="window.cambiarFaceta('${faceta}')">${nombreLimpio}</button>`;
            }
        }

        window.cambiarFaceta = async (nuevaFaceta) => {
            facetaActiva = nuevaFaceta;
            document.querySelectorAll('.btn-menu').forEach(btn => btn.classList.remove('activo'));
            document.getElementById('btn-' + nuevaFaceta).classList.add('activo');
            
            document.getElementById('label-especialidad').innerText = facetaActiva.toUpperCase();
            if (mapaFondos[facetaActiva]) {
                document.getElementById('fondo-nelida').src = "versiones_nelida/" + mapaFondos[facetaActiva];
            }
            
            const nombreLimpio = facetaActiva.replace(/_/g, ' ').toUpperCase();
            document.getElementById('zona-mensajes').innerHTML = `<div id="msg-inicial" class="msg-nelida"><b>Nélida ${nombreLimpio}:</b> Decime qué necesitas y nos ponemos en marcha.</div>`;
            historialAcumulado = []; 
            
            if (currentUser) {
                try {
                    await updateDoc(doc(db, "usuarios", currentUser.uid), {
                        version_seleccionada: nuevaFaceta
                    });
                } catch(e) { console.error("Error guardando nueva faceta", e); }
            }
        };

        window.cerrarSesion = () => {
            signOut(auth).then(() => { window.location.href = "login.html"; })
            .catch((error) => { console.error("Error al cerrar sesión", error); });
        };

        function actualizarContador() {
            const ui = document.getElementById('contador-ui');
            if (ui) {
                if (esUsuarioPro) {
                    ui.innerText = mensajesRestantes > 500 ? "💎 MODO PRO" : `💎 MODO PRO: ${mensajesRestantes} msng`;
                    ui.style.color = "var(--neon-purple)";
                    ui.style.textShadow = "0 0 10px rgba(142, 68, 173, 0.7)";
                } else {
                    ui.innerText = `🔋 Créditos: ${mensajesRestantes}`;
                    ui.style.color = mensajesRestantes === 0 ? "#ff4d4d" : "var(--neon-green)";
                    ui.style.textShadow = mensajesRestantes === 0 ? "0 0 10px rgba(255, 77, 77, 0.7)" : "0 0 10px rgba(0, 255, 204, 0.4)";
                }
            }
        }
        setTimeout(actualizarContador, 200);

        window.botonAudioActivo = null;
        window.textosAudio = window.textosAudio || {}; 

        let archivoDataBase64 = null;
        let archivoMimeType = null;
        let archivoNombre = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                const docSnap = await getDoc(doc(db, "usuarios", user.uid));
                if (docSnap.exists()) { facetaActiva = docSnap.data().version_seleccionada || "ayuda"; }
                renderizarMenu();
                
                document.getElementById('label-especialidad').innerText = facetaActiva.toUpperCase();
                if (mapaFondos[facetaActiva]) { document.getElementById('fondo-nelida').src = "versiones_nelida/" + mapaFondos[facetaActiva]; }
                const nombreLimpio = facetaActiva.replace(/_/g, ' ').toUpperCase();
                document.getElementById('msg-inicial').innerHTML = `<b>Nélida ${nombreLimpio}:</b> Decime qué necesitas y nos ponemos en marcha.`;
            } else { window.location.href = "login.html"; }
        });

        document.getElementById('archivoAdjunto').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                archivoDataBase64 = event.target.result.split(',')[1];
                archivoMimeType = file.type || 'application/octet-stream';
                archivoNombre = file.name;
                document.getElementById('file-name').innerText = `📎 ${archivoNombre}`;
                document.getElementById('file-indicator').style.display = 'flex';
            };
            reader.readAsDataURL(file);
        });

        window.quitarArchivo = () => {
            archivoDataBase64 = null;
            archivoMimeType = null;
            archivoNombre = null;
            document.getElementById('archivoAdjunto').value = ''; 
            document.getElementById('file-indicator').style.display = 'none';
        };

        // EVENTOS DEL TEXTAREA
        const inputTexto = document.getElementById('userInput');
        
        inputTexto.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        inputTexto.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault(); 
                enviar();
            }
        });

        window.enviar = async () => {
            const input = document.getElementById('userInput');
            const zona = document.getElementById('zona-mensajes');
            const texto = input.value.trim();
            
            if (!texto && !archivoDataBase64) return;

            if (texto === "/Odin2026") {
                mensajesRestantes = 2000; 
                esUsuarioPro = true; 
                localStorage.setItem('nelida_pro', 'true'); 
                actualizarContador();
                input.value = "";
                input.style.height = 'auto';
                zona.innerHTML += `<div style="color: var(--neon-green); text-align: center; margin: 15px 0; font-weight: bold;">🔓 ACCESO AUTORIZADO: MODO DIOS ACTIVADO.</div>`;
                zona.scrollTop = zona.scrollHeight;
                return;
            }
            
            if (texto === "/Reset2026") {
                localStorage.removeItem('nelida_pro');
                input.value = "";
                input.style.height = 'auto';
                zona.innerHTML += `<div style="color: #ff4d4d; text-align: center; margin: 15px 0; font-weight: bold;">🔄 MEMORIA BORRADA...</div>`;
                zona.scrollTop = zona.scrollHeight;
                setTimeout(() => { window.location.reload(); }, 2000);
                return;
            }

            let mensajePantalla = texto;
            if (archivoNombre) {
                mensajePantalla += `<br><span style="color:var(--neon-green); font-size:0.85em;">📎 Archivo adjunto: ${archivoNombre}</span>`;
            }
            
            zona.innerHTML += `<div class="msg-usuario">${mensajePantalla}</div>`;
            input.value = "";
            input.style.height = 'auto'; // Resetea la altura de la caja
            zona.scrollTop = zona.scrollHeight;

            const idCarga = "carga-" + Date.now();
            zona.innerHTML += `<div id="${idCarga}" class="escribiendo">Procesando...</div>`;

            historialAcumulado.push({ role: "user", parts: [{ text: texto || "Revisa el documento adjunto." }] });

            if (mensajesRestantes > 0) {
                mensajesRestantes--; 
                actualizarContador();
            }

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        contents: historialAcumulado, 
                        especialidad: facetaActiva, 
                        mensajesRestantes: mensajesRestantes,
                        archivoBase64: archivoDataBase64,
                        archivoMime: archivoMimeType
                    })
                });

                window.quitarArchivo();
                const data = await response.json();
                if (document.getElementById(idCarga)) document.getElementById(idCarga).remove();

                if (response.ok && data.candidates && data.candidates[0].content) {
                    let respuesta = data.candidates[0].content.parts[0].text;
                    const idMsgUnico = "msg-block-" + Date.now();
                    
                    let botonesGenerados = "";
                    let textoNormalizado = respuesta.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                    
                    if (textoNormalizado.includes('nelida pro') || textoNormalizado.includes('suscrip') || textoNormalizado.includes('suscrib') || respuesta.includes('[VENTA]')) {
                        respuesta = respuesta.replace('[VENTA]', '');
                        botonesGenerados += `<button onclick="window.location.href = 'checkout.html'" class="descarga-dinamica" style="background: var(--neon-purple); border: 1px solid var(--neon-green); box-shadow: 0 0 10px rgba(142, 68, 173, 0.4);">💎 OBTENER ACCESO PRO</button>`;
                    }
                    
                    if (respuesta.includes('[CREAR_PDF]')) { respuesta = respuesta.replace('[CREAR_PDF]', ''); botonesGenerados += `<button onclick="window.exportarPDF('${idMsgUnico}')" class="descarga-dinamica" style="background: #e74c3c;">📄 Descargar PDF</button>`; }
                    if (respuesta.includes('[CREAR_EXCEL]')) { respuesta = respuesta.replace('[CREAR_EXCEL]', ''); botonesGenerados += `<button onclick="window.exportarExcel('${idMsgUnico}')" class="descarga-dinamica" style="background: #27ae60;">📊 Descargar Excel</button>`; }
                    if (respuesta.includes('[CREAR_WORD]')) { respuesta = respuesta.replace('[CREAR_WORD]', ''); botonesGenerados += `<button onclick="window.exportarWord('${idMsgUnico}')" class="descarga-dinamica" style="background: #2980b9;">📝 Descargar Word</button>`; }
                    if (respuesta.includes('[CREAR_PPT]')) { respuesta = respuesta.replace('[CREAR_PPT]', ''); botonesGenerados += `<button onclick="window.exportarPPT('${idMsgUnico}')" class="descarga-dinamica" style="background: #d35400;">📺 Descargar PPT</button>`; }

                    historialAcumulado.push({ role: "model", parts: [{ text: respuesta }] });
                    window.textosAudio[idMsgUnico] = encodeURIComponent(respuesta);

                    zona.innerHTML += `
                        <div class="msg-nelida">
                            <div id="${idMsgUnico}">${marked.parse(respuesta)}</div>
                            <div style="display: flex; gap: 8px; margin-top: 15px; flex-wrap: wrap;">
                                <button onclick="window.hablar(this, '${idMsgUnico}')" style="background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 0.85em; transition: 0.3s;">
                                    🔊 Escuchar
                                </button>
                                ${botonesGenerados}
                            </div>
                        </div>`;
                    
                    if (mensajesRestantes === 0 && !botonesGenerados.includes('OBTENER ACCESO PRO')) {
                        zona.innerHTML += `
                        <div style="text-align: center; margin-top: 20px; margin-bottom: 30px;">
                            <button style="background: var(--neon-purple); color: white; border: 1px solid var(--neon-green); padding: 15px 30px; border-radius: 25px; font-weight: bold; cursor: pointer; font-size: 16px;" onclick="window.location.href = 'checkout.html'">
                                💎 OBTENER ACCESO PRO ILIMITADO
                            </button>
                        </div>`;
                    }
                }
            } catch (error) {
                if(document.getElementById(idCarga)) document.getElementById(idCarga).remove();
                zona.innerHTML += `<div style="color: #ff4d4d; margin-bottom: 10px;">Error de conexión.</div>`;
            }
            zona.scrollTop = zona.scrollHeight;
        };

       // --- MOTOR DE EXPORTACIÓN PDF (VERSIÓN CORPORATIVA) ---
        window.exportarPDF = (id) => { 
            const element = document.getElementById(id); 
            const clone = element.cloneNode(true); 
            
            const header = document.createElement('div');
            header.innerHTML = `
                <div style="border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: flex-end;">
                    <h2 style="color: #111; font-family: 'Segoe UI', sans-serif; margin: 0; text-transform: uppercase;">Nélida AI // Reporte Oficial</h2>
                    <span style="color: #555; font-size: 12px; font-weight: bold;">Fecha: ${new Date().toLocaleDateString('es-AR')}</span>
                </div>
            `;
            clone.insertBefore(header, clone.firstChild);

            clone.style.color = '#222'; 
            clone.style.backgroundColor = '#fff'; 
            clone.style.padding = '40px'; 
            clone.style.fontFamily = 'Arial, sans-serif';
            clone.style.fontSize = '14px';
            clone.style.lineHeight = '1.6';

            const tablas = clone.querySelectorAll('table');
            tablas.forEach(tabla => {
                tabla.style.width = '100%';
                tabla.style.borderCollapse = 'collapse';
                tabla.style.margin = '20px 0';
                
                tabla.querySelectorAll('th, td').forEach(celda => {
                    celda.style.border = '1px solid #ccc';
                    celda.style.padding = '12px';
                    celda.style.textAlign = 'left';
                });
                
                tabla.querySelectorAll('th').forEach(th => {
                    th.style.backgroundColor = '#f4f4f4';
                    th.style.color = '#000';
                    th.style.fontWeight = 'bold';
                    th.style.textTransform = 'uppercase';
                });
            });

            const opt = { 
                margin: 0, 
                filename: 'Reporte_Estrategico_Nelida.pdf', 
                image: { type: 'jpeg', quality: 0.98 }, 
                html2canvas: { scale: 2 }, 
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } 
            }; 
            
            html2pdf().set(opt).from(clone).save(); 
        };

        // --- MOTOR DE EXPORTACIÓN EXCEL (VERSIÓN CORPORATIVA) ---
        window.exportarExcel = (id) => { 
            const element = document.getElementById(id); 
            const tablaHtml = element.querySelector('table'); 
            let libroExcel = XLSX.utils.book_new(); 
            
            let matrizDatos = [];
            
            matrizDatos.push(["NÉLIDA AI - REPORTE ESTRATÉGICO"]);
            matrizDatos.push(["Generado el:", new Date().toLocaleString('es-AR')]);
            matrizDatos.push([]); 

            if (tablaHtml) { 
                const filas = tablaHtml.querySelectorAll('tr');
                filas.forEach(fila => {
                    let arrayFila = [];
                    fila.querySelectorAll('th, td').forEach(celda => {
                        arrayFila.push(celda.innerText);
                    });
                    matrizDatos.push(arrayFila);
                });
            } else { 
                element.querySelectorAll('p, li, h1, h2, h3').forEach(el => { 
                    matrizDatos.push([el.innerText]); 
                }); 
            } 
            
            const hoja = XLSX.utils.aoa_to_sheet(matrizDatos); 

            const anchosColumnas = matrizDatos.reduce((acc, fila) => {
                fila.forEach((celda, i) => {
                    const largo = celda ? celda.toString().length : 10;
                    acc[i] = Math.max(acc[i] || 15, largo + 2);
                });
                return acc;
            }, []);
            
            hoja['!cols'] = anchosColumnas.map(w => ({ wch: Math.min(w, 80) }));

            XLSX.utils.book_append_sheet(libroExcel, hoja, "Reporte Oficial"); 
            XLSX.writeFile(libroExcel, 'Reporte_Estrategico_Nelida.xlsx'); 
        };

        // --- MOTORES WORD Y PPT (INTACTOS) ---
        window.exportarWord = (id) => { const element = document.getElementById(id); const htmlCompleto = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><title>Documento</title></head><body>${element.innerHTML}</body></html>`; const blob = new Blob(['\ufeff' + htmlCompleto], { type: 'application/msword' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'Documento_NelidaAI.doc'; a.click(); };
        window.exportarPPT = (id) => { const element = document.getElementById(id); let pptx = new pptxgen(); let slide = pptx.addSlide(); let posicionY = 1.0; element.querySelectorAll('h1, h2, h3, p, li').forEach(el => { if (posicionY < 6.0) { let esTitulo = el.tagName.startsWith('H'); slide.addText(el.innerText, { x: 1.0, y: posicionY, w: 8.0, h: esTitulo ? 0.5 : 0.8, fontSize: esTitulo ? 24 : 14, bold: esTitulo, color: esTitulo ? '8E44AD' : '333333' }); posicionY += esTitulo ? 0.6 : 0.9; } else { slide = pptx.addSlide(); posicionY = 1.0; } }); pptx.writeFile({ fileName: 'Presentacion_NelidaAI.pptx' }); };
       window.hablar = async (btnElement, idMsgUnico) => {
            const esProActual = localStorage.getItem('nelida_pro') === 'true';
            
            if (!esProActual) {
                alert("💎 La función de audio es exclusiva para usuarios PRO.");
                window.location.href = 'checkout.html';
                return;
            }

            const cajaVideo = document.getElementById('caja-video');
            
            if (window.audioNelida && !window.audioNelida.paused) {
                window.audioNelida.pause();
                window.audioNelida.currentTime = 0;
                btnElement.innerHTML = '🔊 Escuchar';
                if(cajaVideo) cajaVideo.classList.remove('modo-hablando');
                return;
            }

            const textoLimpio = decodeURIComponent(window.textosAudio[idMsgUnico]).replace(/[#*_]/g, '');
            btnElement.innerHTML = '⏳ Cargando voz...';
            
            try {
                const res = await fetch('/api/hablar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ texto: textoLimpio })
                });

                if (!res.ok) throw new Error("Error en el servidor de voz");
                
                // LA SOLUCIÓN: Recibimos el audio crudo (Blob) y lo transformamos en una URL reproducible
                const audioBlob = await res.blob();
                const audioUrl = URL.createObjectURL(audioBlob);
                
                window.audioNelida = new Audio(audioUrl);
                btnElement.innerHTML = '⏹️ Detener';
                if(cajaVideo) cajaVideo.classList.add('modo-hablando');
                window.audioNelida.play();
                
                window.audioNelida.onended = () => {
                    btnElement.innerHTML = '🔊 Escuchar';
                    if(cajaVideo) cajaVideo.classList.remove('modo-hablando');
                };
                
            } catch (e) {
                console.error("Error de audio:", e);
                alert("⏳ Hubo un problema al procesar el audio. Por favor, intenta de nuevo.");
                btnElement.innerHTML = '🔊 Escuchar';
            }
        };
    </script>
</body>
