<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nélida AI - Interface Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/PptxGenJS@3.12.0/dist/pptxgen.bundle.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        :root { --neon-green: #00ffcc; --neon-purple: #8e44ad; --neon-blue: #00d2ff; --glass-bg: rgba(0, 0, 0, 0.85); --glass-border: rgba(0, 255, 204, 0.25); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #030303; font-family: 'Orbitron', 'Segoe UI', sans-serif; color: #fff; min-height: 100vh; }
        #fondo-nelida { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; filter: brightness(0.25) blur(4px); }
        .interfaz-usuario { position: relative; z-index: 10; display: flex; flex-direction: row; justify-content: space-between; align-items: center; height: 100vh; padding: 2% 4%; gap: 25px; }
        .contenedor-estetico { background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 16px; box-shadow: 0 0 30px rgba(0, 255, 204, 0.05); display: flex; flex-direction: column; overflow: hidden; }
        #caja-chat { width: 62%; height: 85vh; }
        #caja-video { width: 35%; height: 60vh; position: relative; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.95); border-color: rgba(0, 210, 255, 0.2); transition: 0.5s ease-in-out; box-shadow: 0 0 25px rgba(0, 210, 255, 0.05); }
        #caja-video.modo-hablando { border-color: var(--neon-blue); box-shadow: 0 0 40px rgba(0, 210, 255, 0.35), 0 0 70px rgba(142, 68, 173, 0.2); }
        .status-bar { padding: 14px 20px; background: rgba(0, 255, 204, 0.07); border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; font-size: 0.85em; letter-spacing: 2px; text-transform: uppercase; }
        #contador-ui { font-weight: bold; font-size: 1.1em; transition: 0.3s; }
        #zona-mensajes { flex: 1; overflow-y: auto; padding: 25px; color: #e5e5e5; font-size: 1.05em; line-height: 1.6; scrollbar-width: thin; scrollbar-color: var(--neon-green) transparent; }
        .msg-usuario { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px 12px 0 12px; padding: 12px 18px; margin-bottom: 15px; max-width: 85%; margin-left: auto; text-align: left; color: rgba(255,255,255,0.9); }
        .msg-nelida { background: rgba(0, 255, 204, 0.01); border-left: 3px solid var(--neon-green); padding: 15px; margin-bottom: 25px; border-radius: 0 12px 12px 12px; }
        .input-box { display: flex; padding: 16px 20px; gap: 12px; background: rgba(0, 0, 0, 0.7); border-top: 1px solid var(--glass-border); align-items: center; }
        .input-wrapper { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        #file-indicator { display: none; align-items: center; gap: 10px; background: rgba(0, 255, 204, 0.1); border: 1px solid var(--neon-green); padding: 6px 12px; border-radius: 5px; font-size: 0.85em; color: var(--neon-green); width: fit-content; font-family: 'Segoe UI', sans-serif; }
        #file-indicator button { background: none; border: none; color: #ff4d4d; cursor: pointer; font-weight: bold; font-size: 1.1em; padding: 0 5px; }
        input[type="text"] { width: 100%; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border); color: #fff; padding: 14px; border-radius: 10px; outline: none; font-size: 15px; height: 50px; transition: 0.3s; }
        .btn-action { background: var(--neon-purple); color: white; border: none; padding: 0 25px; cursor: pointer; border-radius: 10px; font-weight: bold; height: 50px; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; font-size: 13px; transition: 0.3s; }
        .btn-action:hover { filter: brightness(1.15); }
        .btn-clip { background: none; border: none; font-size: 26px; cursor: pointer; padding: 0 5px; height: 50px; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: cover; border-radius: 15px; }
        .escribiendo { color: var(--neon-green); font-style: italic; font-size: 0.9em; animation: pulse 1.5s infinite; padding-left: 15px; }
        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
        .descarga-dinamica { border: none; color: white; padding: 10px 18px; border-radius: 5px; cursor: pointer; font-size: 0.85em; font-family: 'Orbitron', sans-serif; transition: 0.3s; font-weight: bold; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        @media (max-width: 768px) { body { overflow-y: auto; } .interfaz-usuario { flex-direction: column; height: auto; padding: 12px; gap: 15px; justify-content: flex-start; } #caja-video { width: 100%; height: 190px; margin-top: 5px; } #caja-chat { width: 100%; height: calc(100vh - 230px); min-height: 400px; } }
    </style>
</head>
<body>
    <img id="fondo-nelida" src="versiones_nelida/ayuda.png">
    <div class="interfaz-usuario">
        <div id="caja-chat" class="contenedor-estetico">
            <div class="status-bar"><div><span id="label-especialidad">SISTEMA NÉLIDA</span></div><div id="contador-ui">Cargando sistema...</div></div>
            <div id="zona-mensajes"><div id="msg-inicial" class="msg-nelida"><b>Nélida:</b> Sincronizando faceta...</div></div>
            <div class="input-box">
                <input type="file" id="archivoAdjunto" style="display: none;" accept=".pdf, .xls, .xlsx, .doc, .docx, .txt, image/*">
                <button type="button" class="btn-clip" onclick="document.getElementById('archivoAdjunto').click()" title="Adjuntar documento">📎</button>
                <div class="input-wrapper">
                    <div id="file-indicator"><span id="file-name">📎 Archivo.pdf</span><button onclick="window.quitarArchivo()" title="Quitar archivo">✖</button></div>
                    <input type="text" id="userInput" placeholder="Escribe aquí..." onkeypress="if(event.key==='Enter') enviar()">
                </div>
                <button class="btn-action" onclick="enviar()">ENVIAR</button>
            </div>
        </div>
        <div id="caja-video" class="contenedor-estetico">
            <video id="nelida-video" autoplay loop muted playsinline><source src="versiones_nelida/cerebronelida.mp4" type="video/mp4"></video>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        // ... [TU CONFIG FIREBASE ORIGINAL] ...
        const firebaseConfig = { apiKey: "AIzaSyBVEFGwRHGjX1TuyXQohdTXsm4Tq39jSkg", authDomain: "nelida-e89d3.firebaseapp.com", projectId: "nelida-e89d3", storageBucket: "nelida-e89d3.firebasestorage.app", messagingSenderId: "135147571928", appId: "1:135147571928:web:347838ce007dac458225ad" };
        const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

        let esUsuarioPro = localStorage.getItem('nelida_pro') === 'true';
        window.audioNelida = null;
        window.textosAudio = {};

        // --- FUNCIÓN HABLAR FINAL ---
        window.hablar = async (btnElement, idMsgUnico) => {
            const esProActual = localStorage.getItem('nelida_pro') === 'true';
            
            // 1. FILTRO: Solo PRO puede escuchar
            if (!esProActual) {
                alert("💎 La función de audio es exclusiva para usuarios PRO.");
                window.location.href = 'checkout.html';
                return;
            }

            const cajaVideo = document.getElementById('caja-video');
            
            // 2. DETENER SI YA ESTÁ SONANDO
            if (window.audioNelida && !window.audioNelida.paused) {
                window.audioNelida.pause();
                window.audioNelida.currentTime = 0;
                btnElement.innerHTML = '🔊 Escuchar';
                if(cajaVideo) cajaVideo.classList.remove('modo-hablando');
                return;
            }

            // 3. REPRODUCIR
            const textoLimpio = decodeURIComponent(window.textosAudio[idMsgUnico]).replace(/[#*_]/g, '');
            btnElement.innerHTML = '⏳ Cargando...';
            
            try {
                const res = await fetch('/api/hablar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ texto: textoLimpio })
                });
                const data = await res.json();
                
                if (data.audioBase64) {
                    window.audioNelida = new Audio("data:audio/mp3;base64," + data.audioBase64);
                    btnElement.innerHTML = '⏹️ Detener';
                    if(cajaVideo) cajaVideo.classList.add('modo-hablando');
                    window.audioNelida.play();
                    
                    window.audioNelida.onended = () => {
                        btnElement.innerHTML = '🔊 Escuchar';
                        if(cajaVideo) cajaVideo.classList.remove('modo-hablando');
                    };
                } else {
                    alert("Error en la voz");
                    btnElement.innerHTML = '🔊 Escuchar';
                }
            } catch (e) {
                alert("Error de conexión");
                btnElement.innerHTML = '🔊 Escuchar';
            }
        };

        // --- AQUI VA EL RESTO DE TU CODIGO ORIGINAL (enviar, exportarPDF, etc) ---
        // (Simplemente pega debajo tus funciones originales desde tu archivo viejo)
    </script>
</body>
</html>
