<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nélida AI - Interface Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/PptxGenJS@3.12.0/dist/pptxgen.bundle.js"></script>
    
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --neon-green: #00ffcc;
            --neon-purple: #8e44ad;
            --glass-bg: rgba(0, 0, 0, 0.8);
            --glass-border: rgba(0, 255, 204, 0.3);
        }
        body { margin: 0; background-color: #000; overflow: hidden; font-family: 'Orbitron', 'Segoe UI', sans-serif; color: #fff; }
        #fondo-nelida { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; filter: brightness(0.4) blur(2px); }
        .interfaz-usuario { position: relative; z-index: 10; display: flex; justify-content: space-between; align-items: center; height: 100vh; padding: 0 3%; gap: 20px; }
        .contenedor-estetico { height: 80%; background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); border-radius: 15px; box-shadow: 0 0 25px rgba(0, 255, 204, 0.1); display: flex; flex-direction: column; overflow: hidden; animation: breathe 5s infinite ease-in-out; }
        @keyframes breathe { 0%, 100% { box-shadow: 0 0 15px rgba(0, 255, 204, 0.1); } 50% { box-shadow: 0 0 30px rgba(0, 255, 204, 0.25); border-color: var(--neon-green); } }
        #caja-chat { width: 45%; }
        .status-bar { padding: 10px 20px; background: rgba(0, 255, 204, 0.1); border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; font-size: 0.8em; letter-spacing: 2px; text-transform: uppercase; }
        #zona-mensajes { flex: 1; overflow-y: auto; padding: 25px; color: #e0e0e0; font-size: 1.05em; line-height: 1.7; scrollbar-width: thin; scrollbar-color: var(--neon-green) transparent; }
        
        .input-box { display: flex; padding: 20px; gap: 12px; background: rgba(0, 0, 0, 0.5); border-top: 1px solid var(--glass-border); align-items: flex-end; }
        .input-wrapper { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        
        #file-indicator { display: none; align-items: center; gap: 10px; background: rgba(0, 255, 204, 0.1); border: 1px solid var(--neon-green); padding: 6px 12px; border-radius: 5px; font-size: 0.85em; color: var(--neon-green); width: fit-content; font-family: 'Segoe UI', sans-serif; }
        #file-indicator button { background: none; border: none; color: #ff4d4d; cursor: pointer; font-weight: bold; font-size: 1.1em; padding: 0 5px; }
        
        input[type="text"] { width: 100%; box-sizing: border-box; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); color: #fff; padding: 14px; border-radius: 8px; outline: none; }
        .btn-action { background: var(--neon-purple); color: white; border: none; padding: 0 25px; cursor: pointer; border-radius: 8px; font-weight: bold; height: 46px; }
        #caja-video { width: 50%; position: relative; }
        video { width: 100%; height: 100%; object-fit: cover; border-radius: 15px; }
        .escribiendo { color: var(--neon-green); font-style: italic; font-size: 0.9em; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }

        /* Estilos dinámicos para cuando Nélida decide generar un archivo */
        .descarga-dinamica { border: none; color: white; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-size: 0.85em; font-family: 'Orbitron', sans-serif; transition: 0.3s; font-weight: bold; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .descarga-dinamica:hover { filter: brightness(1.2); transform: scale(1.02); }
    </style>
</head>
<body>
    <img id="fondo-nelida" src="versiones_nelida/ayuda.png">
    
    <div class="interfaz-usuario">
        <div id="caja-chat" class="contenedor-estetico">
            <div class="status-bar">
                <div><span id="label-especialidad">SISTEMA NÉLIDA</span></div>
            </div>
            <div id="zona-mensajes">
                <p id="msg-inicial"><b>Nélida:</b> Sincronizando faceta...</p>
            </div>
            <div class="input-box">
                <input type="file" id="archivoAdjunto" style="display: none;" accept=".pdf, .xls, .xlsx, .doc, .docx, .txt, image/*">
                <button type="button" onclick="document.getElementById('archivoAdjunto').click()" style="background: none; border: none; font-size: 24px; cursor: pointer; padding: 0 5px; height: 46px;" title="Adjuntar documento">📎</button>
                
                <div class="input-wrapper">
                    <div id="file-indicator">
                        <span id="file-name">📎 Archivo.pdf</span>
                        <button onclick="window.quitarArchivo()" title="Quitar archivo">✖</button>
                    </div>
                    <input type="text" id="userInput" placeholder="Escribe aquí..." onkeypress="if(event.key==='Enter') enviar()">
                </div>
                
                <button class="btn-action" onclick="enviar()">ENVIAR</button>
            </div>
        </div>

        <div id="caja-video" class="contenedor-estetico">
            <video id="nelida-video" autoplay loop muted playsinline>
                <source src="nelida_video.mp4" type="video/mp4">
            </video>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBVEFGwRHGjX1TuyXQohdTXsm4Tq39jSkg",
            authDomain: "nelida-e89d3.firebaseapp.com",
            projectId: "nelida-e89d3",
            storageBucket: "nelida-e89d3.firebasestorage.app",
            messagingSenderId: "135147571928",
            appId: "1:135147571928:web:347838ce007dac458225ad"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let facetaActiva = "ayuda";
        let historialAcumulado = [];
        
        let mensajesRestantes = 3; 
        window.botonAudioActivo = null;

        // NUEVAS VARIABLES PARA EL ARCHIVO
        let archivoDataBase64 = null;
        let archivoMimeType = null;
        let archivoNombre = null;

        const mapaFondos = {
            "artes_marciales": "ARTES MARCIALES MIXTAS.png",
            "ayuda": "ayuda.png",
            "contratista": "contratista.PNG", 
            "Economia": "Economia.PNG",
            "infantes": "infantes.png",
            "maestra": "maestra.png",
            "mecanica": "mecanica.PNG",
            "medica": "medica.png",
            "trainer": "nelida trainner.png",
            "padel": "padel.png",
            "psicologa": "psicologa.png",
            "sexologa": "sexologa.png",
            "tenis": "tenis.png",
            "terapia_parejas": "terapia deparejas.PNG"
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                const docSnap = await getDoc(doc(db, "usuarios", user.uid));
                if (docSnap.exists()) {
                    facetaActiva = docSnap.data().version_seleccionada || "ayuda";
                    document.getElementById('label-especialidad').innerText = facetaActiva.toUpperCase();
                    
                    if (mapaFondos[facetaActiva]) {
                        document.getElementById('fondo-nelida').src = "versiones_nelida/" + mapaFondos[facetaActiva];
                    }

                    const nombreLimpio = facetaActiva.replace(/_/g, ' ').toUpperCase();
                    document.getElementById('msg-inicial').innerHTML = `<b>Nélida ${nombreLimpio}:</b> Decime qué necesitas y nos ponemos en marcha.`;
                }
            } else { window.location.href = "login.html"; }
        });

        // NUEVA FUNCIÓN: LEER EL ARCHIVO Y PASARLO A BASE64
        document.getElementById('archivoAdjunto').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                archivoDataBase64 = event.target.result.split(',')[1];
                archivoMimeType = file.type || 'application/octet-stream';
                archivoNombre = file.name;

                // Mostrar el cartelito
                document.getElementById('file-name').innerText = `📎 ${archivoNombre}`;
                document.getElementById('file-indicator').style.display = 'flex';
            };
            reader.readAsDataURL(file);
        });

        // NUEVA FUNCIÓN: QUITAR EL ARCHIVO SI SE ARREPIENTE
        window.quitarArchivo = () => {
            archivoDataBase64 = null;
            archivoMimeType = null;
            archivoNombre = null;
            document.getElementById('archivoAdjunto').value = ''; 
            document.getElementById('file-indicator').style.display = 'none';
        };

        window.enviar = async () => {
            const input = document.getElementById('userInput');
            const zona = document.getElementById('zona-mensajes');
            const texto = input.value.trim();
            
            // Si no hay ni texto ni archivo, no hacemos nada
            if (!texto && !archivoDataBase64) return;

            // --- PUERTA TRASERA SEGURA (SOLO PARA HERNÁN) ---
            if (texto === "/Odin2026") {
                mensajesRestantes = undefined;
                input.value = "";
                zona.innerHTML += `<div style="color: var(--neon-green); text-align: center; margin: 15px 0; font-weight: bold; font-family: 'Orbitron', sans-serif;">🔓 ACCESO AUTORIZADO: Créditos recargados.</div>`;
                zona.scrollTop = zona.scrollHeight;
                return;
            }
            // ----------------------------------------------

            // Mostrar el mensaje en pantalla (con el archivo si lo hay)
            let mensajePantalla = texto;
            if (archivoNombre) {
                mensajePantalla += `<br><span style="color:var(--neon-green); font-size:0.85em;">📎 Archivo adjunto: ${archivoNombre}</span>`;
            }
            zona.innerHTML += `<div style="color: rgba(255,255,255,0.6); text-align: right; margin-bottom: 10px;">> ${mensajePantalla}</div>`;
            
            input.value = "";
            zona.scrollTop = zona.scrollHeight;

            const idCarga = "carga-" + Date.now();
            zona.innerHTML += `<div id="${idCarga}" class="escribiendo">Procesando...</div>`;

            historialAcumulado.push({ role: "user", parts: [{ text: texto || "Revisa el documento adjunto." }] });

            if (mensajesRestantes > 0) {
                mensajesRestantes--;
            }

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        contents: historialAcumulado, 
                        especialidad: facetaActiva, 
                        mensajesRestantes: mensajesRestantes,
                        archivoBase64: archivoDataBase64,
                        archivoMime: archivoMimeType
                    })
                });

                // LIMPIAMOS EL ARCHIVO DESPUÉS DE ENVIARLO
                window.quitarArchivo();

                const data = await response.json();
                if (document.getElementById(idCarga)) document.getElementById(idCarga).remove();

                if (response.ok && data.candidates && data.candidates[0].content) {
                    let respuesta = data.candidates[0].content.parts[0].text;
                    const idMsgUnico = "msg-block-" + Date.now();
                    
                    // --- DETECTOR QUIRÚRGICO DE PALABRAS MÁGICAS ---
                    let botonesGenerados = "";
                    
                    if (respuesta.includes('[CREAR_PDF]')) {
                        respuesta = respuesta.replace('[CREAR_PDF]', '');
                        botonesGenerados += `<button onclick="window.exportarPDF('${idMsgUnico}')" class="descarga-dinamica" style="background: #e74c3c;">📄 Descargar PDF</button>`;
                    }
                    if (respuesta.includes('[CREAR_EXCEL]')) {
                        respuesta = respuesta.replace('[CREAR_EXCEL]', '');
                        botonesGenerados += `<button onclick="window.exportarExcel('${idMsgUnico}')" class="descarga-dinamica" style="background: #27ae60;">📊 Descargar Excel</button>`;
                    }
                    if (respuesta.includes('[CREAR_WORD]')) {
                        respuesta = respuesta.replace('[CREAR_WORD]', '');
                        botonesGenerados += `<button onclick="window.exportarWord('${idMsgUnico}')" class="descarga-dinamica" style="background: #2980b9;">📝 Descargar Word</button>`;
                    }
                    if (respuesta.includes('[CREAR_PPT]')) {
                        respuesta = respuesta.replace('[CREAR_PPT]', '');
                        botonesGenerados += `<button onclick="window.exportarPPT('${idMsgUnico}')" class="descarga-dinamica" style="background: #d35400;">📺 Descargar PPT</button>`;
                    }
                    // -----------------------------------------------

                    historialAcumulado.push({ role: "model", parts: [{ text: respuesta }] });
                    const safeRespuesta = respuesta.replace(/"/g, '&quot;').replace(/'/g, '&#39;');

                    // INYECCIÓN DINÁMICA DE LOS BOTONES (Solo si existen)
                    zona.innerHTML += `
                        <div style="margin-bottom: 25px; border-left: 2px solid var(--neon-green); padding-left: 15px;">
                            <div id="${idMsgUnico}">${marked.parse(respuesta)}</div>
                            <div style="display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap;">
                                <button onclick="window.hablar(this, this.getAttribute('data-texto'))" data-texto="${safeRespuesta}" style="background: rgba(0, 255, 204, 0.15); border: 1px solid var(--neon-green); color: white; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: 0.85em; font-family: 'Orbitron', sans-serif; transition: 0.3s;" title="Control de audio">
                                    🔊 Escuchar
                                </button>
                                ${botonesGenerados}
                            </div>
                        </div>`;
                    
                    if (mensajesRestantes === 0) {
                        zona.innerHTML += `
                        <div style="text-align: center; margin-top: 20px; margin-bottom: 30px;">
                            <button style="background: var(--neon-purple); color: white; border: 1px solid var(--neon-green); padding: 15px 30px; border-radius: 8px; font-family: 'Orbitron', sans-serif; font-weight: bold; cursor: pointer; font-size: 16px; box-shadow: 0 4px 15px rgba(142, 68, 173, 0.4);" onclick="window.location.href = 'checkout.html'">
                                💎 OBTENER ACCESO PRO ILIMITADO
                            </button>
                        </div>`;
                }

                } else {
                    const errorMsg = data.error?.message || data.error || "Error de respuesta";
                    zona.innerHTML += `<div style="color: #ff4d4d; margin-bottom: 10px;">Error: ${errorMsg}</div>`;
                }
            } catch (error) {
                if(document.getElementById(idCarga)) document.getElementById(idCarga).remove();
                window.quitarArchivo(); // Limpiar también si hay error
                zona.innerHTML += `<div style="color: #ff4d4d; margin-bottom: 10px;">Error de conexión.</div>`;
            }
            zona.scrollTop = zona.scrollHeight;
        };

        // --- SISTEMA MAESTRO DE GENERACIÓN DE ARCHIVOS ---

        // 1. GENERADOR DE PDF CORPORATIVO
        window.exportarPDF = (id) => {
            const element = document.getElementById(id);
            const clone = element.cloneNode(true);
            
            clone.style.color = '#000000';
            clone.style.backgroundColor = '#ffffff';
            clone.style.padding = '30px';
            clone.style.fontFamily = 'Arial, sans-serif';
            
            const opt = {
                margin:       15,
                filename:     'Reporte_NelidaAI.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, backgroundColor: '#ffffff' },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(clone).save();
        };

        // 2. GENERADOR DE EXCEL INTELIGENTE
        window.exportarExcel = (id) => {
            const element = document.getElementById(id);
            const tablaHtml = element.querySelector('table');
            let libroExcel;

            if (tablaHtml) {
                libroExcel = XLSX.utils.table_to_book(tablaHtml);
            } else {
                const lineas = [];
                element.querySelectorAll('p, li, h1, h2, h3').forEach(el => {
                    lineas.push([el.innerText]);
                });
                const hoja = XLSX.utils.aoa_to_sheet(lineas);
                libroExcel = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(libroExcel, hoja, "Datos");
            }
            XLSX.writeFile(libroExcel, 'Planilla_NelidaAI.xlsx');
        };

        // 3. GENERADOR DE WORD IMPECABLE
        window.exportarWord = (id) => {
            const element = document.getElementById(id);
            const htmlCompleto = `
                <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                <head><title>Documento Nélida AI</title><style>body { font-family: Arial, sans-serif; line-height: 1.6; color: #000; }</style></head>
                <body>${element.innerHTML}</body>
                </html>`;
            
            const blob = new Blob(['\ufeff' + htmlCompleto], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Documento_NelidaAI.doc';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };

        // 4. GENERADOR DE DIAPOSITIVAS DE POWERPOINT
        window.exportarPPT = (id) => {
            const element = document.getElementById(id);
            let pptx = new pptxgen();
            let slide = pptx.addSlide();
            
            let posicionY = 1.0;
            element.querySelectorAll('h1, h2, h3, p, li').forEach(el => {
                if (posicionY < 6.0) {
                    let esTitulo = el.tagName.startsWith('H');
                    slide.addText(el.innerText, { 
                        x: 1.0, 
                        y: posicionY, 
                        w: 8.0, 
                        h: esTitulo ? 0.5 : 0.8, 
                        fontSize: esTitulo ? 24 : 14,
                        bold: esTitulo,
                        color: esTitulo ? '8E44AD' : '333333'
                    });
                    posicionY += esTitulo ? 0.6 : 0.9;
                } else {
                    slide = pptx.addSlide();
                    posicionY = 1.0;
                }
            });
            pptx.writeFile({ fileName: 'Presentacion_NelidaAI.pptx' });
        };

        window.hablar = (btnElement, texto) => {
            const synth = window.speechSynthesis;

            if (window.botonAudioActivo === btnElement) {
                if (synth.speaking && !synth.paused) {
                    synth.pause();
                    btnElement.innerHTML = '▶️ Continuar';
                    btnElement.style.background = 'rgba(255, 204, 0, 0.2)'; 
                    btnElement.style.borderColor = '#ffcc00';
                } else if (synth.paused) {
                    synth.resume();
                    btnElement.innerHTML = '⏸️ Pausar';
                    btnElement.style.background = 'rgba(142, 68, 173, 0.3)'; 
                    btnElement.style.borderColor = 'var(--neon-purple)';
                } else {
                    iniciarLectura(btnElement, texto, synth);
                }
            } else {
                if (window.botonAudioActivo) {
                    window.botonAudioActivo.innerHTML = '🔊 Escuchar';
                    window.botonAudioActivo.style.background = 'rgba(0, 255, 204, 0.15)';
                    window.botonAudioActivo.style.borderColor = 'var(--neon-green)';
                }
                synth.cancel(); 
                iniciarLectura(btnElement, texto, synth);
            }
        };

        function iniciarLectura(btn, texto, synth) {
            window.botonAudioActivo = btn;
            btn.innerHTML = '⏸️ Pausar';
            btn.style.background = 'rgba(142, 68, 173, 0.3)';
            btn.style.borderColor = 'var(--neon-purple)';
            
            const lectura = new SpeechSynthesisUtterance(texto.replace(/[#*`_]/g, ''));
            lectura.lang = 'es-AR';
            
            lectura.onend = () => {
                btn.innerHTML = '🔊 Escuchar';
                btn.style.background = 'rgba(0, 255, 204, 0.15)';
                btn.style.borderColor = 'var(--neon-green)';
                window.botonAudioActivo = null;
            };
            
            synth.speak(lectura);
        }
    </script>
</body>
</html>
