<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nélida AI - Seleccionar Faceta</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        // CAMBIO TÁCTICO: Cambiamos updateDoc por setDoc para evitar crasheos con cuentas viejas
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBVEFGwRHGjX1TuyXQohdTXsm4Tq39jSkg",
            authDomain: "nelida-e89d3.firebaseapp.com",
            projectId: "nelida-e89d3",
            storageBucket: "nelida-e89d3.firebasestorage.app",
            messagingSenderId: "135147571928",
            appId: "1:135147571928:web:347838ce007dac458225ad"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let usuarioActual = null;

        // Sin sesión: mostramos un cartel con botones (nunca saltamos solos al login)
        function pantallaSinSesion(titulo, texto) {
            document.documentElement.style.visibility = 'visible';
            document.title = 'Nélida AI';
            document.body.style.cssText = 'margin:0;padding:0;display:block;background:#07070b;';
            document.body.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;font-family:'Segoe UI',-apple-system,sans-serif;"><div style="max-width:360px;width:100%;text-align:center;color:#e8e8e8;background:#12121a;border:1px solid rgba(0,255,204,.25);border-radius:16px;padding:28px;box-sizing:border-box;"><h1 style="color:#fff;font-size:1.5em;margin:0 0 10px;">Nélida <span style="color:#00ffcc">AI</span></h1><p style="margin:0 0 6px;font-weight:bold;color:#fff;">${titulo}</p><p style="margin:0 0 20px;line-height:1.5;color:#a8a8b3;">${texto}</p><a href="registro.html" style="display:block;background:#8e44ad;color:#fff;padding:13px;border-radius:10px;text-decoration:none;font-weight:bold;margin-bottom:10px;">Crear cuenta gratis</a><a href="login.html" style="display:block;border:1px solid #00ffcc;color:#fff;padding:12px;border-radius:10px;text-decoration:none;margin-bottom:14px;">Ya tengo cuenta</a><a href="index.html" style="color:#00ffcc;font-size:.9em;text-decoration:none;">← Volver al inicio</a></div></div>`;
        }

        // Faceta elegida desde la portada (menu.html?f=trainer). Se guarda por si hay que registrarse antes.
        const IDS_VALIDOS = ["abogada","artes_marciales","asistente","ayuda","contratista","Economia","infantes","maestra","mecanica","medica","mejora_continua","trainer","padel","pesca","psicologa","seguridad_higiene","sexologa","tenis","terapia_parejas"];
        try {
            const pedida = new URLSearchParams(window.location.search).get('f');
            if (pedida && IDS_VALIDOS.includes(pedida)) localStorage.setItem('nelida_faceta_elegida', pedida);
        } catch (e) {}

        onAuthStateChanged(auth, async (user) => {
            if (user) { 
                usuarioActual = user; 
                
                // --- PROCESAMIENTO DE PAGO BLINDADO CON CLAVE SECRETA ---
                // (Eliminado: la activación PRO por enlace secreto. Ahora solo la hace el servidor.)
                if (window.location.search) window.history.replaceState({}, document.title, window.location.pathname);

                // --- BLOQUE DE SEGURIDAD INTERNA ---
                try {
                    const docRef = doc(db, "usuarios", user.uid);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        const esProReal = data.plan === 'PRO' || data.esUsuarioPro === true;
                        localStorage.setItem('nelida_plan', esProReal ? 'PRO' : 'FREE');
                    }
                } catch (e) { console.error("Error validando estado:", e); }

                // Si eligió una faceta en la portada, entra directo a esa Nélida
                let elegida = null;
                try { elegida = localStorage.getItem('nelida_faceta_elegida'); localStorage.removeItem('nelida_faceta_elegida'); } catch (e) {}
                if (elegida && IDS_VALIDOS.includes(elegida)) {
                    try { await setDoc(doc(db, "usuarios", user.uid), { version_seleccionada: elegida }, { merge: true }); } catch (e) {}
                    window.location.href = "interaccion.html";
                    return;
                }

            } else { 
                pantallaSinSesion('Elegí tu Nélida', 'Para usar Nélida necesitás una cuenta. Es gratis y tenés 10 mensajes de prueba.');
            }
        });

        const facetas = [
            { id: "abogada", nombre: "Abogada", desc: "Asesoría Legal y Contratos", img: "versiones_nelida/abogada.PNG" },
            { id: "artes_marciales", nombre: "Artes Marciales", desc: "Disciplina y fuerza", img: "versiones_nelida/ARTES MARCIALES MIXTAS.png" },
            { id: "asistente", nombre: "Asistente Personal", desc: "Organización y Agenda", img: "versiones_nelida/nelida_asistente.PNG" },
            { id: "ayuda", nombre: "Ayuda", desc: "Soporte general", img: "versiones_nelida/ayuda.png" },
            { id: "contratista", nombre: "Contratista", desc: "Gestión de obras del hogar", img: "versiones_nelida/contratista.PNG" }, 
            { id: "Economia", nombre: "Economía", desc: "Consejos económicos", img: "versiones_nelida/Economia.PNG" },
            { id: "infantes", nombre: "Infantes", desc: "Desarrollo infantil", img: "versiones_nelida/infantes.png" },
            { id: "maestra", nombre: "Maestra", desc: "Educación", img: "versiones_nelida/maestra.png" },
            { id: "mecanica", nombre: "Mecánica", desc: "Servicio automotriz", img: "versiones_nelida/mecanica.PNG" },
            { id: "medica", nombre: "Médica", desc: "Salud integral", img: "versiones_nelida/medica.png" },
            { id: "mejora_continua", nombre: "Mejora Continua", desc: "Procesos Industriales", img: "versiones_nelida/nelida_mc.PNG" },
            { id: "trainer", nombre: "Nélida Trainer", desc: "Fitness", img: "versiones_nelida/nelida trainner.png" },
            { id: "padel", nombre: "Pádel", desc: "Estrategia y Entrenamiento", img: "versiones_nelida/padel.png" },
            { id: "pesca", nombre: "Pescadora", desc: "Pesca en Ríos y Mares", img: "versiones_nelida/nelida_pesca.PNG" },
            { id: "psicologa", nombre: "Psicóloga", desc: "Salud mental", img: "versiones_nelida/psicologa.png" },
            { id: "seguridad_higiene", nombre: "Seg. e Higiene", desc: "Normativas y Prevención", img: "versiones_nelida/nelida_tsh.PNG" },
            { id: "sexologa", nombre: "Sexóloga", desc: "Educación sexual y Fantasías", img: "versiones_nelida/sexologa.png" },
            { id: "tenis", nombre: "Tenis", desc: "Entrenamiento y Estrategias", img: "versiones_nelida/tenis.png" },
            { id: "terapia_parejas", nombre: "Terapia de Parejas", desc: "Vínculos Amorosos", img: "versiones_nelida/terapia deparejas.PNG" }
        ];

        let indiceActual = 0;
        window.cambiarFaceta = (dir) => {
            indiceActual += dir;
            if (indiceActual < 0) indiceActual = facetas.length - 1;
            if (indiceActual >= facetas.length) indiceActual = 0;
            actualizarUI();
        };

        function actualizarUI() {
            const f = facetas[indiceActual];
            document.getElementById('img-ruleta').src = f.img; 
            document.getElementById('nombre-faceta').innerText = f.nombre.toUpperCase();
            document.getElementById('desc-faceta').innerText = f.desc;
        }

        window.seleccionarYEntrar = async () => {
            if (!usuarioActual) return;
            const seleccionada = facetas[indiceActual].id;
            const btn = document.querySelector('.btn-confirmar');
            btn.innerText = "CARGANDO...";
            try {
                // COMANDO BLINDADO: Si el usuario no tiene datos previos, se los crea sin tirar error.
                await setDoc(doc(db, "usuarios", usuarioActual.uid), { version_seleccionada: seleccionada }, { merge: true });
                window.location.href = "interaccion.html"; 
            } catch (e) { 
                console.error(e);
                btn.innerText = "ERROR, REINTENTAR"; 
            }
        };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Segoe+UI&display=swap');
        :root { --neon-green: #00ffcc; --neon-purple: #8e44ad; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* CORRECCIÓN DE PANTALLA: Se adapta al alto, pero oculta desbordes horizontales */
        body { 
            background-color: #050505; 
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #000000 100%); 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            min-height: 100vh; 
            overflow-x: hidden;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 20px;
        }
        
        h1 { font-family: 'Orbitron', sans-serif; color: var(--neon-green); margin-bottom: 20px; font-size: 2em; letter-spacing: 2px; text-align: center;}
        
        /* CORRECCIÓN DE CAJA: Tamaño elástico, nunca superará el ancho del celular */
        .ruleta-container { position: relative; width: 100%; max-width: 320px; aspect-ratio: 3/4; display: flex; align-items: center; justify-content: center; margin: 0 auto; }
        .img-principal { width: 100%; height: 100%; object-fit: cover; border-radius: 20px; border: 1px solid rgba(0, 255, 204, 0.3); }
        
        /* CORRECCIÓN DE FLECHAS: Colocadas en el borde interno, sin romper la pantalla */
        .flecha { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.75); border: 1px solid rgba(0, 255, 204, 0.5); color: var(--neon-green); font-size: 24px; cursor: pointer; border-radius: 50%; width: 45px; height: 45px; z-index: 10; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px);}
        .flecha-izq { left: -15px; } 
        .flecha-der { right: -15px; }
        
        .info-faceta { text-align: center; margin-top: 25px; padding: 0 10px; }
        #nombre-faceta { font-family: 'Orbitron'; font-size: 1.4em; }
        #desc-faceta { color: var(--neon-purple); font-weight: bold; margin-top: 5px; font-size: 0.9em; }
        
        .btn-confirmar { margin-top: 20px; background: var(--neon-purple); color: white; padding: 15px 40px; border-radius: 30px; font-family: 'Orbitron'; font-weight: bold; cursor: pointer; border: none; font-size: 1.1em; box-shadow: 0 4px 15px rgba(142,68,173,0.3); transition: 0.3s;}
        .btn-confirmar:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <h1>NÉLIDA AI</h1>
    <div class="ruleta-container">
        <button class="flecha flecha-izq" onclick="cambiarFaceta(-1)">❮</button>
        <img id="img-ruleta" src="versiones_nelida/abogada.PNG" class="img-principal">
        <button class="flecha flecha-der" onclick="cambiarFaceta(1)">❯</button>
    </div>
    <div class="info-faceta">
        <h2 id="nombre-faceta">ABOGADA</h2>
        <p id="desc-faceta">Asesoría Legal y Contratos</p>
    </div>
    <button class="btn-confirmar" onclick="seleccionarYEntrar()">CONFIRMAR</button>
</body>
</html>
