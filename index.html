<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nélida AI - Inicio</title>
    <link rel="stylesheet" href="style.css">
    
    <script>
        // Si el sistema detecta que es un celular o la pantalla es pequeña, salta instantáneamente al login
        if (/Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 800) {
            window.location.replace('login.html');
        }
    </script>
    </head>
<body>

    <main class="contenedor-unico">
        <img src="1.png" alt="Nélida AI" class="imagen-total">

        <button onclick="irALogin()" class="btn-unico-final"></button>
    </main>

    <script>
        function irALogin() {
            // Lógica de redirección original para usuarios en computadora
            window.location.href = 'login.html';
        }
    </script>

</body>
</html>
