<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nélida AI - Inicio</title>
    <link rel="stylesheet" href="style.css">
    
    <script>
        // Si el sistema detecta que es un celular o la pantalla es pequeña, salta instantáneamente al login
        if (/Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 800) {
            window.location.replace('login.html');
        }
    </script>
    <style>
        /* Barra legal: Botón de Arrepentimiento y Botón de Baja (Disposición 954/2025) */
        .barra-legal {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
            display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 10px 18px;
            padding: 10px 16px; background: rgba(0, 0, 0, 0.96); border-top: 1px solid rgba(0, 255, 204, 0.3);
            font-family: 'Segoe UI', Tahoma, sans-serif; font-size: 13px;
        }
        .barra-legal a { color: #e5e5e5; text-decoration: none; }
        .barra-legal a:hover { text-decoration: underline; }
        .barra-legal .boton-legal { color: #fff; font-weight: bold; border: 1px solid #00ffcc; border-radius: 6px; padding: 6px 12px; }
    </style>
    </head>
<body>

    <main class="contenedor-unico">
        <img src="1.png" alt="Nélida AI" class="imagen-total">

        <button onclick="irALogin()" class="btn-unico-final"></button>
    </main>

    <nav class="barra-legal" aria-label="Información legal">
        <a class="boton-legal" href="tramite.html?tipo=arrepentimiento">Botón de Arrepentimiento</a>
        <a class="boton-legal" href="tramite.html?tipo=baja">Botón de Baja de Servicio</a>
        <a href="terminos.html">Términos de Servicio</a>
        <a href="privacidad.html">Política de Privacidad</a>
    </nav>

    <script>
        function irALogin() {
            // Lógica de redirección original para usuarios en computadora
            window.location.href = 'login.html';
        }
    </script>

</body>
</html>
